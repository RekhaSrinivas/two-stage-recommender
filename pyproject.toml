[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "two-stage-recommender"
version = "0.1.0"
description = "Portfolio-grade two-stage (retrieval -> ranking) recommender on MovieLens."
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.13.1",
    "pyyaml==6.0.2",
    "tqdm==4.66.5",
    "threadpoolctl==3.5.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
